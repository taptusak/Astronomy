<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบทดสอบ บทที่ 6 การแปรสัณฐานของแผ่นธรณี</title>
<style>
  :root{
    --crust: #2b2118;
    --mantle: #b5451b;
    --mantle-hot: #e2662b;
    --ocean: #1c5a63;
    --ocean-light: #3f8b93;
    --sand: #efe6d6;
    --paper: #fbf7ee;
    --ink: #241b12;
    --good: #2f7d4f;
    --bad: #b23a2f;
    --line: rgba(43,33,24,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(226,102,43,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(28,90,99,0.12), transparent 55%),
      var(--sand);
    color:var(--ink);
    font-family: "Sarabun","Noto Sans Thai","Segoe UI",sans-serif;
    line-height:1.6;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    padding-bottom:22px;
    border-bottom:2px solid var(--crust);
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .kicker{
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--mantle);
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-size:clamp(24px,4vw,32px);
    margin:0;
    color:var(--crust);
    font-weight:800;
  }
  .meta{
    text-align:right;
    font-size:14px;
    color:#5a5040;
  }

  /* progress strip styled like rock layers */
  .strata{
    display:flex;
    gap:4px;
    margin-bottom:26px;
  }
  .stratum{
    flex:1;
    height:10px;
    border-radius:2px;
    background:#ddd0b8;
    transition:background .25s ease;
  }
  .stratum.done{background:var(--ocean);}
  .stratum.current{background:var(--mantle-hot);}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:28px;
    box-shadow: 0 1px 0 rgba(43,33,24,0.05);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:linear-gradient(180deg,var(--mantle-hot),var(--ocean));
  }

  .qnum{
    font-size:13px;
    color:var(--ocean);
    font-weight:700;
    margin-bottom:6px;
  }
  .qtext{
    font-size:19px;
    font-weight:700;
    color:var(--crust);
    margin:0 0 20px;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    text-align:right;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:#fff;
    cursor:pointer;
    font-size:16px;
    transition:border-color .15s ease, background .15s ease;
  }
  .option:hover{border-color:var(--ocean-light);}
  .option .letter{
    flex:0 0 auto;
    width:26px;height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--crust);
  }
  .option.selected{border-color:var(--ocean);background:rgba(28,90,99,0.06);}
  .option.selected .letter{background:var(--ocean);color:#fff;border-color:var(--ocean);}
  .option.correct{border-color:var(--good);background:rgba(47,125,79,0.09);}
  .option.correct .letter{background:var(--good);color:#fff;border-color:var(--good);}
  .option.incorrect{border-color:var(--bad);background:rgba(178,58,47,0.08);}
  .option.incorrect .letter{background:var(--bad);color:#fff;border-color:var(--bad);}
  .option.disabled{cursor:default;}

  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:4px;
    font-size:15px;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:rgba(47,125,79,0.10);color:#204f34;border:1px solid rgba(47,125,79,0.3);}
  .feedback.bad{background:rgba(178,58,47,0.09);color:#7a281e;border:1px solid rgba(178,58,47,0.28);}
  .feedback b{display:block;margin-bottom:4px;}

  .nav{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
  }
  button.next{
    background:var(--crust);
    color:var(--paper);
    border:none;
    padding:12px 26px;
    border-radius:4px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    opacity:0.4;
    pointer-events:none;
    transition:opacity .15s ease, background .15s ease;
    font-family:inherit;
  }
  button.next.active{opacity:1;pointer-events:auto;}
  button.next:hover.active{background:var(--mantle);}

  /* results */
  .result{
    text-align:center;
  }
  .score-ring{
    width:150px;height:150px;
    margin:6px auto 20px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    background:conic-gradient(var(--ocean) calc(var(--pct)*1%), #e3d8c2 0);
    position:relative;
  }
  .score-ring::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:var(--paper);
  }
  .score-num{position:relative;font-size:34px;font-weight:800;color:var(--crust);}
  .score-sub{position:relative;font-size:13px;color:#6b6153;}
  .verdict{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--crust);}
  .verdict-sub{color:#5a5040;margin-bottom:24px;}
  .review-list{text-align:right;display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .review-item{
    padding:12px 14px;
    border-radius:4px;
    border:1px solid var(--line);
    background:#fff;
    font-size:14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }
  .review-item .tag{
    flex:0 0 auto;
    font-size:12px;
    font-weight:700;
    padding:2px 8px;
    border-radius:20px;
    color:#fff;
  }
  .tag.ok{background:var(--good);}
  .tag.no{background:var(--bad);}
  .restart{
    background:none;
    border:1.5px solid var(--crust);
    color:var(--crust);
    padding:11px 24px;
    border-radius:4px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
  }
  .restart:hover{background:var(--crust);color:#fff;}

  footer{
    text-align:center;
    margin-top:40px;
    font-size:12.5px;
    color:#8a7f6c;
  }

  @media (max-width:480px){
    .card{padding:20px;}
    .meta{text-align:left;}
    header.top{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="kicker">วิทยาศาสตร์โลกและอวกาศ · บทที่ 6</div>
      <h1>การแปรสัณฐานของแผ่นธรณี</h1>
    </div>
    <div class="meta">แบบทดสอบ 30 ข้อ<br>ทวีปเลื่อน · แผ่ขยายพื้นสมุทร · แปรสัณฐาน</div>
  </header>

  <div class="strata" id="strata"></div>

  <div id="quizArea"></div>

  <footer>อ้างอิงเนื้อหาจากเอกสารการอบรม สสวท. สาขาฟิสิกส์และวิทยาศาสตร์โลก</footer>
</div>

<script>

      "ทฤษฎีการแปรสัณฐานของแผ่นธรณี → ทฤษฎีทวีปเลื่อน → ทฤษฎีการแผ่ขยายพื้นสมุทร",

  },
  {
    q: "แผ่นธรณี (Tectonic plate) เป็นส่วนหนึ่งของโครงสร้างโลกที่ประกอบด้วยส่วนใด",
    options: [
      "แก่นโลกชั้นในเท่านั้น",

      "เนื้อโลกชั้นล่างสุดที่ติดกับแก่นโลก",

    ],

    explain: "แผ่นธรณีคือส่วนของธรณีภาค (เปลือกโลก + เนื้อโลกส่วนบนสุดที่แข็งเกร็ง) ซึ่งแตกออกเป็นแผ่น ๆ และวางตัวลอยอยู่บนฐานธรณีภาคที่มีสถานะอ่อนนุ่มกว่าและสามารถเคลื่อนที่ได้"

  {

    options: [
      "ธรณีสัณฐานและโครงสร้างทางธรณีแบบต่าง ๆ เกิดขึ้นแบบสุ่ม ไม่เกี่ยวข้องกับแผ่นธรณี",
      "ธรณีสัณฐานและโครงสร้างทางธรณีแบบต่าง ๆ เกิดขึ้นบริเวณแนวรอยต่อของแผ่นธรณีที่สัมพันธ์กับรูปแบบการเคลื่อนที่ของแผ่นธรณี",

    explain: "จากกิจกรรมท่องโลกกว้างตามหาธรณีสัณฐานและโครงสร้างทางธรณี สรุปได้ว่าธรณีสัณฐานและโครงสร้างทางธรณีแบบต่าง ๆ เกิดขึ้นบริเวณแนวรอยต่อของแผ่นธรณีที่สัมพันธ์กับการเคลื่อนที่ของแผ่นธรณีแต่ละรูปแบบ"
  }

let current = 0;
let selectedIndex = null;
let answered = false;
let userAnswers = [];

const quizArea = document.getElementById("quizArea");
const strataEl = document.getElementById("strata");

function buildStrata(){
  strataEl.innerHTML = "";
  questions.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "stratum";
    if(i < current) d.classList.add("done");
    if(i === current) d.classList.add("current");
    strataEl.appendChild(d);
  });
}

function renderQuestion(){
  answered = false;
  selectedIndex = null;
  buildStrata();

  const item = questions[current];
  const letters = ["ก","ข","ค","ง"];

  quizArea.innerHTML = `
    <div class="card">
      <div class="qnum">ข้อที่ ${current+1} จาก ${questions.length}</div>
      <p class="qtext">${item.q}</p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav">
        <button class="next" id="nextBtn">${current === questions.length-1 ? "ดูผลคะแนน" : "ข้อถัดไป"}</button>
      </div>
    </div>
  `;

  const optionsEl = document.getElementById("options");
  item.options.forEach((opt, idx) => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt}</span>`;
    div.addEventListener("click", () => selectOption(idx));
    optionsEl.appendChild(div);
  });

  document.getElementById("nextBtn").addEventListener("click", goNext);
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  selectedIndex = idx;
  userAnswers[current] = idx;

  const item = questions[current];
  const optionEls = document.querySelectorAll("#options .option");
  optionEls.forEach((el, i) => {
    el.classList.add("disabled");
    if(i === item.correct) el.classList.add("correct");
    if(i === idx && idx !== item.correct) el.classList.add("incorrect");
    if(i === idx) el.classList.add("selected");
  });

  const fb = document.getElementById("feedback");
  const isCorrect = idx === item.correct;
  fb.classList.add("show", isCorrect ? "good" : "bad");
  fb.innerHTML = `<b>${isCorrect ? "ถูกต้อง!" : "ยังไม่ถูก"}</b>${item.explain}`;

  document.getElementById("nextBtn").classList.add("active");
}

function goNext(){
  if(!answered) return;
  if(current < questions.length - 1){
    current++;
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult(){
  const score = userAnswers.reduce((acc, ans, i) => acc + (ans === questions[i].correct ? 1 : 0), 0);
  const pct = Math.round((score / questions.length) * 100);

  let verdict, verdictSub;
  if(pct >= 90){ verdict = "ยอดเยี่ยม! พร้อมสอบแล้ว"; verdictSub = "เข้าใจทั้งสามทฤษฎีอย่างแม่นยำ"; }
  else if(pct >= 70){ verdict = "ทำได้ดี"; verdictSub = "ทบทวนข้อที่พลาดอีกนิดเดียว"; }
  else if(pct >= 50){ verdict = "พอใช้"; verdictSub = "ควรกลับไปอ่านหลักฐานของแต่ละทฤษฎีอีกครั้ง"; }
  else { verdict = "ต้องทบทวนเพิ่ม"; verdictSub = "ลองอ่านสรุปแล้วทำแบบทดสอบใหม่อีกครั้ง"; }

  let reviewHtml = "";
  questions.forEach((item, i) => {
    const ok = userAnswers[i] === item.correct;
    reviewHtml += `
      <div class="review-item">
        <span class="tag ${ok ? "ok" : "no"}">${ok ? "ถูก" : "ผิด"}</span>
        <span>ข้อ ${i+1}: ${item.q}</span>
      </div>
    `;
  });

  quizArea.innerHTML = `
    <div class="card result">
      <div class="score-ring" style="--pct:${pct}">
        <div class="score-num">${score}/${questions.length}</div>
        <div class="score-sub">${pct}%</div>
      </div>
      <div class="verdict">${verdict}</div>
      <div class="verdict-sub">${verdictSub}</div>
      <div class="review-list">${reviewHtml}</div>
      <button class="restart" id="restartBtn">ทำแบบทดสอบอีกครั้ง</button>
    </div>
  `;
  strataEl.innerHTML = "";
  questions.forEach(() => {
    const d = document.createElement("div");
    d.className = "stratum done";
    strataEl.appendChild(d);
  });

  document.getElementById("restartBtn").addEventListener("click", () => {
    current = 0;
    userAnswers = [];
    renderQuestion();
  });
}

renderQuestion();
</script>
